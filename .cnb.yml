$:
  push:
    - name: test-and-build
      docker:
        image: node:22
      stages:
        - name: install
          # corepack 按根目录 package.json 的 packageManager 字段自动启用对应 pnpm 版本
          script: |
            corepack enable
            pnpm install
        - name: test
          script: pnpm test
        - name: typecheck
          script: pnpm run typecheck
        - name: build
          script: pnpm run build
        - name: examples
          script: |
            for example in vite-vue3 vite-vue2 vite-react vite-web-components webpack-vue3 rollup-react rolldown-react rspack-react esbuild-react; do
              echo "==> building examples/$example"
              (cd "examples/$example" && pnpm install && pnpm run build) || exit 1
            done
  pull_request:
    - name: test-and-build
      docker:
        image: node:22
      stages:
        - name: install
          script: |
            corepack enable
            pnpm install
        - name: test
          script: pnpm test
        - name: typecheck
          script: pnpm run typecheck
        - name: build
          script: pnpm run build
        - name: examples
          script: |
            for example in vite-vue3 vite-vue2 vite-react vite-web-components webpack-vue3 rollup-react rolldown-react rspack-react esbuild-react; do
              echo "==> building examples/$example"
              (cd "examples/$example" && pnpm install && pnpm run build) || exit 1
            done
