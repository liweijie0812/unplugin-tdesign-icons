$:
  vscode:
    - name: workspace
      docker:
        image: cnbcool/default-dev-env:latest
      services:
        - vscode
        - docker
      stages:
        - name: install
          # corepack 按根目录 package.json 的 packageManager 字段自动启用对应 pnpm 版本
          # workspace：examples/* 通过 workspace:* 引用本包，根 pnpm install 统一安装全部
          script: |
            corepack enable
            pnpm install
  push:
    - name: test-and-build
      docker:
        image: node:22
      stages:
        - name: install
          # corepack 按根目录 package.json 的 packageManager 字段自动启用对应 pnpm 版本
          script: |
            corepack enable
            pnpm install
        - name: test
          script: pnpm test
        - name: typecheck
          script: pnpm run typecheck
        - name: build
          script: pnpm run build
        - name: examples
          # 无需逐个 pnpm install（workspace 根已统一安装），直接用 --filter 构建
          script: |
            for example in vite-vue3 vite-vue2 vite-react vite-web-components webpack-vue3 rollup-react rolldown-react rspack-react esbuild-react; do
              echo "==> building examples/$example"
              pnpm --filter "unplugin-tdesign-icons-example-$example" run build || exit 1
            done
  pull_request:
    - name: test-and-build
      docker:
        image: node:22
      stages:
        - name: install
          script: |
            corepack enable
            pnpm install
        - name: test
          script: pnpm test
        - name: typecheck
          script: pnpm run typecheck
        - name: build
          script: pnpm run build
        - name: examples
          script: |
            for example in vite-vue3 vite-vue2 vite-react vite-web-components webpack-vue3 rollup-react rolldown-react rspack-react esbuild-react; do
              echo "==> building examples/$example"
              pnpm --filter "unplugin-tdesign-icons-example-$example" run build || exit 1
            done
