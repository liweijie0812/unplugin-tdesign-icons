name: pkg-pr-new
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    if: ${{ github.repository == 'liweijie0812/unplugin-tdesign-icons' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: 'pnpm'

      - run: pnpm ci

      - run: pnpm build

      - run: pnpm dlx pkg-pr-new publish --template examples --packageManager=npm,pnpm,bun
